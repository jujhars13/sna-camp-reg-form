# ingress controller rules
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gurdwara-displays-ing
  annotations:
    kubernetes.io/ingress.class: traefik

spec:
  ingressClassName: traefik
  rules:
    - host: har-rai.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: one.k8s.home.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
