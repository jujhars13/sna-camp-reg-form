networks:
  default:
    name: ingress-proxy
    external: true
  # Private link between oauth2-proxy and the reports app. Nothing else is on
  # it, so the only way to reach reports is through oauth2-proxy, which is what
  # makes its X-Forwarded-Email header trustworthy.
  reports:
    name: sna-camp-reports

x-common-labels: &common-labels
  com.centurylinklabs.watchtower.enable: true
  com.jujhar.project: "sna-camp-form"
  org.opencontainers.image.vendor: "com.jujhar"
  org.opencontainers.image.authors: "jujhar@jujhar.com"

services:
  frontend:
    container_name: sna-camp-form
    image: ghcr.io/jujhars13/sna-camp-form:latest
    restart: unless-stopped
    networks:
      - default
    labels:
      <<: *common-labels

  # Entry point for admin.snacamp.org. The external router terminates TLS and
  # forwards plain HTTP to port 80 here. Any Google account can sign in; which
  # camps they then see is decided by the reports app from access.yaml.
  oauth2-proxy:
    container_name: sna-camp-form-admin
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?set OAUTH2_PROXY_CLIENT_ID in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?set OAUTH2_PROXY_CLIENT_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set OAUTH2_PROXY_COOKIE_SECRET in .env}
      OAUTH2_PROXY_COOKIE_NAME: _sna_reports
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:80
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PROXY_PREFIX: /admin/oauth2
      OAUTH2_PROXY_REDIRECT_URL: https://admin.snacamp.org/admin/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://sna-camp-reports:3000
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
    ports:
      - "80:80"
    networks:
      - default
      - reports
    depends_on:
      - reports
    labels:
      <<: *common-labels

  reports:
    container_name: sna-camp-reports
    image: ghcr.io/jujhars13/sna-camp-reports:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DATABASE_SSL: ${DATABASE_SSL:-verify}
      DATABASE_CA_FILE: ${DATABASE_CA_FILE:-}
    volumes:
      # access.yaml (and optionally Supabase's CA cert for DATABASE_CA_FILE)
      - ./reports/config:/srv/reports/config:ro
    networks:
      - reports
    labels:
      <<: *common-labels
